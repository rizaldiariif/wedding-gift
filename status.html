<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF7F2">
<title>Status Hadiah — Defa &amp; Aldi</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .status-page {
    padding: 6.5rem 0 clamp(3rem, 8vw, 6rem);
  }

  .status-title {
    font-size: clamp(2rem, 4.5vw, 2.8rem);
  }

  .status-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .9rem;
    margin-top: 1rem;
    color: var(--muted);
    font-size: .85rem;
  }

  .status-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: .8rem;
    margin-top: 1.8rem;
  }

  .stat-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
    box-shadow: var(--shadow-sm);
  }

  .stat-card strong {
    display: block;
    font-family: var(--serif);
    font-size: 2rem;
    font-weight: 600;
    line-height: 1.1;
  }

  .stat-card span {
    font-size: .68rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .status-list {
    display: flex;
    flex-direction: column;
    gap: .6rem;
    margin-top: 1.6rem;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.2rem;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    box-shadow: var(--shadow-sm);
  }

  .status-row.is-claimed {
    border-color: #CBE0CB;
    background: linear-gradient(rgba(203, 224, 203, .22), rgba(203, 224, 203, .22)), var(--white);
  }

  .status-cat {
    display: block;
    font-size: .62rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: .15rem;
  }

  .status-name {
    font-size: 1.2rem;
  }

  .status-name a {
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
  }

  .status-name a:hover {
    text-decoration-color: var(--gold);
  }

  .status-price {
    display: block;
    font-size: .85rem;
    color: var(--muted);
    margin-top: .15rem;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    padding: .45rem .95rem;
    border-radius: 999px;
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .status-badge svg {
    width: .95em;
    height: .95em;
    flex-shrink: 0;
  }

  .status-badge.is-claimed {
    background: #E7F2E7;
    border: 1px solid #CBE0CB;
    color: #4E7A4E;
  }

  .status-badge.is-claimed .guest {
    text-transform: none;
    letter-spacing: .02em;
    font-family: var(--serif);
    font-size: .95rem;
    font-weight: 600;
    color: #3D633D;
  }

  .status-badge.is-open {
    background: var(--cream);
    border: 1px solid var(--line);
    color: var(--muted);
  }

  .status-error {
    margin-top: 1.2rem;
    padding: .8rem 1rem;
    border-radius: var(--radius-sm);
    background: var(--gold-tint);
    color: var(--ink-soft);
    font-size: .87rem;
  }

  @media (max-width: 620px) {
    .status-row {
      flex-direction: column;
      align-items: flex-start;
      gap: .7rem;
    }

    .stat-card {
      padding: .8rem .85rem;
    }

    .stat-card strong {
      font-size: 1.5rem;
    }

    .stat-card span {
      font-size: .56rem;
      letter-spacing: .12em;
    }
  }
</style>
</head>
<body>
<a class="skip-link" href="#status-list">Lewati ke daftar status</a>

<header class="nav scrolled" id="site-nav">
  <div class="nav-inner container">
    <a class="brand" href="./" aria-label="Kembali ke halaman tamu">
      <span class="brand-mono">D &amp; A</span>
      <span class="brand-label" data-text="shortNames">Defa &amp; Aldi</span>
    </a>
    <a class="btn btn-sm btn-ghost" href="./">Halaman Tamu</a>
  </div>
</header>

<main class="container status-page">
  <header>
    <p class="eyebrow">Wedding Gift Registry</p>
    <h1 class="status-title">Status Hadiah</h1>
    <p class="status-meta">
      <span>Diperbarui <strong id="updated">…</strong></span>
      <button type="button" class="btn btn-sm btn-outline" id="refresh">Muat Ulang</button>
    </p>
  </header>

  <section class="status-stats" aria-label="Ringkasan">
    <div class="stat-card"><strong id="stat-claimed">0</strong><span>Sudah ditandai</span></div>
    <div class="stat-card"><strong id="stat-open">0</strong><span>Belum ditandai</span></div>
    <div class="stat-card"><strong id="stat-total">0</strong><span>Total hadiah</span></div>
  </section>

  <section class="status-list" id="status-list" aria-live="polite"></section>
  <p class="status-error" id="status-error" hidden></p>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <p class="footer-names" data-text="names">Defa &amp; Aldi</p>
    <p class="footer-thanks">Halaman ini untuk memantau hadiah yang sudah ditandai tamu.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/status.js"></script>
</body>
</html>
